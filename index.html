<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گردونه شانس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#182033}header{background:#111827;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.light{background:#fff}.wrap{max-width:1200px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000d}.wheelbox{display:flex;justify-content:center;align-items:center;position:relative}.wheel{width:min(78vw,500px);height:min(78vw,500px);border-radius:50%;border:10px solid #fff;box-shadow:0 12px 40px #0003;position:relative;overflow:hidden;background:#ddd}.pointer{position:absolute;top:-2px;z-index:3;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #ef4444;filter:drop-shadow(0 3px 2px #0004)}.seg{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:30px;font-weight:800;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 2px #000;background:conic-gradient(var(--c) calc(var(--a)*1deg),#0000 0)}.seg span{width:90px;transform:rotate(var(--rot));margin-top:18px}.spin{font-size:20px;background:#16a34a;color:white;margin-top:18px;width:100%}.result{margin-top:18px;text-align:center;display:none}.result img{max-width:220px;max-height:180px;border-radius:14px;display:block;margin:10px auto}.admin{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;padding:10px;border:1px solid #d7dce5;border-radius:9px;font:inherit;margin-top:5px}label{font-size:13px;font-weight:700}.segrow{border:1px solid #e4e7ec;padding:12px;border-radius:12px;margin:10px 0;background:#fafafa}.segrow img{width:70px;height:55px;object-fit:cover;border-radius:8px}.seghead{display:flex;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.muted{color:#667085;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wheel{width:330px;height:330px}}
</style></head><body><header><h1 id="title">گردونه شانس</h1><button class="btn light" onclick="showAdmin()">⚙️ مدیریت</button></header><main class="wrap"><section id="game"><div class="grid"><div class="card wheelbox"><div class="pointer"></div><div id="wheel" class="wheel"></div><button class="btn spin" onclick="spin()">🎡 چرخاندن گردونه</button><div id="result" class="result"></div></div><div class="card"><h2>جوایز گردونه</h2><p class="muted">هر تکه می‌تواند عکس، نام جایزه و شانس جداگانه داشته باشد.</p><div id="prizes"></div></div></div></section><section id="admin" class="admin"><div class="card"><h2>مدیریت گردونه</h2><div class="row"><div><label>نام گردونه</label><input id="siteName"></div><div><label>تعداد تکه‌ها</label><input id="count" type="number" min="2" max="24" value="6" onchange="resizeSegments()"></div></div><div id="segments"></div><div class="actions"><button class="btn primary" onclick="save()">💾 ذخیره تغییرات</button><button class="btn" onclick="addSegment()">➕ افزودن تکه</button><button class="btn" onclick="hideAdmin()">بازگشت</button></div><p class="muted">عکس‌ها روی سرور در پوشه uploads ذخیره می‌شوند و تنظیمات در data/site.json قرار می‌گیرد.</p></div></section></main><script>
let site={name:'گردونه شانس',segments:[]};let spinning=false;
const colors=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#e11d48','#06b6d4'];
async function load(){site=await fetch('/api/site').then(r=>r.json());if(!site.segments.length)site.segments=[...Array(6)].map((_,i)=>({name:'جایزه '+(i+1),description:'',image:'',weight:1}));document.getElementById('title').textContent=site.name;document.getElementById('siteName').value=site.name;document.getElementById('count').value=site.segments.length;render();renderAdmin()}
function render(){let w=document.getElementById('wheel');w.innerHTML='';let n=site.segments.length;site.segments.forEach((s,i)=>{let d=document.createElement('div');d.className='seg';d.style.setProperty('--a',i*360/n);d.style.setProperty('--c',colors[i%colors.length]);d.style.clipPath=`polygon(50% 50%, 50% 0%, ${50+50*Math.tan(Math.min(Math.PI*2/n,Math.PI/2))}% 0%, 50% 50%)`;d.style.transform=`rotate(${i*360/n}deg)`;let sp=document.createElement('span');sp.style.setProperty('--rot',`${-i*360/n}deg`);sp.textContent=s.name||'جایزه';d.appendChild(sp);w.appendChild(d)});document.getElementById('prizes').innerHTML=site.segments.map((s,i)=>`<div><b>${i+1}. ${esc(s.name)}</b><div class="muted">${esc(s.description||'')}</div></div>`).join('')}
function renderAdmin(){document.getElementById('segments').innerHTML=site.segments.map((s,i)=>`<div class="segrow"><div class="seghead">${s.image?`<img src="${s.image}">`:''}<div style="flex:1"><label>نام جایزه</label><input value="${attr(s.name)}" oninput="site.segments[${i}].name=this.value;render()"></div></div><label>توضیحات</label><textarea oninput="site.segments[${i}].description=this.value">${esc(s.description||'')}</textarea><div class="row"><div><label>شانس</label><input type="number" min="0" value="${s.weight??1}" oninput="site.segments[${i}].weight=+this.value"></div><div><label>عکس جایزه</label><input type="file" accept="image/*" onchange="upload(${i},this)"></div></div></div>`).join('')}
function resizeSegments(){let n=+document.getElementById('count').value;while(site.segments.length<n)site.segments.push({name:'جایزه '+(site.segments.length+1),description:'',image:'',weight:1});site.segments.length=n;render();renderAdmin()}
function addSegment(){site.segments.push({name:'جایزه '+(site.segments.length+1),description:'',image:'',weight:1});document.getElementById('count').value=site.segments.length;render();renderAdmin()}
async function upload(i,input){if(!input.files[0])return;let f=new FormData();f.append('image',input.files[0]);let r=await fetch('/api/upload',{method:'POST',body:f});let j=await r.json();site.segments[i].image=j.url;renderAdmin()}
async function save(){site.name=document.getElementById('siteName').value||'گردونه شانس';await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(site)});render();alert('ذخیره شد ✅')}
function showAdmin(){document.getElementById('game').style.display='none';document.getElementById('admin').style.display='block';renderAdmin()}function hideAdmin(){document.getElementById('admin').style.display='none';document.getElementById('game').style.display='block'}
function spin(){if(spinning||!site.segments.length)return;spinning=true;let total=site.segments.reduce((a,s)=>a+Math.max(0,+s.weight||0),0);let r=Math.random()*total,idx=0;for(let i=0;i<site.segments.length;i++){r-=Math.max(0,+site.segments[i].weight||0);if(r<=0){idx=i;break}}let n=site.segments.length;let target=360*5+(360-(idx+.5)*360/n);let w=document.getElementById('wheel');w.style.transition='transform 4s cubic-bezier(.12,.72,.15,1)';w.style.transform=`rotate(${target}deg)`;setTimeout(()=>{let s=site.segments[idx];let box=document.getElementById('result');box.style.display='block';box.innerHTML=`<h2>🎉 تبریک!</h2><p>شما برنده <b>${esc(s.name)}</b> شدید.</p>${s.image?`<img src="${s.image}">`:''}<p>${esc(s.description||'')}</p>`;spinning=false},4100)}
function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function attr(x){return esc(x).replace(/"/g,'&quot;')};load();
</script></body></html>
